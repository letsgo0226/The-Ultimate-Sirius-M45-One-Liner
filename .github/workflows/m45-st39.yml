name: M45 ST39 Verified Controller
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'm45-st39/**'
      - 'm45-st38/**'
      - 'm45-st37/**'
      - 'm45-st32/**'
      - '.github/workflows/m45-st39.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s m45-st39 -p 'test_*.py'
      - name: Verify and persist controlled computation
        run: |
          python3 m45-st39/controller.py --init --file controller-ledger.json --max-batches 8 --steps-per-batch 1
          python3 m45-st39/controller.py --verify-only --file controller-ledger.json
      - uses: actions/upload-artifact@v4
        with:
          name: m45-st39-controller-ledger
          path: controller-ledger.json
