name: M45 ST89 Dual Engine CI
on:
  pull_request:
    paths:
      - 'm45_st89.py'
      - 'test_m45_st89.py'
      - '.github/workflows/m45-st89.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest -v test_m45_st89.py
      - run: python3 m45_st89.py VERIFY
      - run: python3 m45_st89.py HALT
      - run: python3 m45_st89.py CONTINUE --steps 3 --interval 0.01
