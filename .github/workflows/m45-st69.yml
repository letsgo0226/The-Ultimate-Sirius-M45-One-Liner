name: M45 ST69 Relational Observer Estimation
on:
  push:
    paths:
      - 'm45-st69/**'
      - 'm45-st64/frame_switch.py'
      - 'm45-st68/quantum_metrology.py'
      - '.github/workflows/m45-st69.yml'
  pull_request:
    paths:
      - 'm45-st69/**'
      - 'm45-st64/frame_switch.py'
      - 'm45-st68/quantum_metrology.py'
      - '.github/workflows/m45-st69.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s m45-st69 -p 'test_*.py'
      - run: python3 m45-st69/observer_estimation.py --theta 0.3 --shots 1000 --seed 2026
