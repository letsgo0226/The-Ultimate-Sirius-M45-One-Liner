name: M45 ST52 Observational Equivalence
on:
  push:
    paths:
      - 'm45-st52/**'
      - '.github/workflows/m45-st52.yml'
  pull_request:
    paths:
      - 'm45-st52/**'
      - '.github/workflows/m45-st52.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s m45-st52 -p 'test_*.py'
      - run: python3 m45-st52/equivalence.py --denominator 4
