name: M45 ST38 Verified Persistence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'm45-st38/**'
      - 'm45-st37/**'
      - 'm45-st32/**'
      - '.github/workflows/m45-st38.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s m45-st38 -p 'test_*.py'
      - name: Initialize, resume and verify ledger
        run: |
          python3 m45-st38/ledger.py --file ledger.json --init --budget 1
          python3 m45-st38/ledger.py --file ledger.json --budget 1
          python3 m45-st38/ledger.py --file ledger.json --verify-only
      - uses: actions/upload-artifact@v4
        with:
          name: m45-st38-verified-ledger
          path: ledger.json
