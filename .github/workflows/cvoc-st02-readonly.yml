name: CVOC ST02 Read-only Staging CI
on:
  pull_request:
    paths:
      - 'cvoc-st02/**'
      - '.github/workflows/cvoc-st02-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test read-only CVOC interface
        run: python3 -m unittest discover -s cvoc-st02 -p 'test_*.py' -v
