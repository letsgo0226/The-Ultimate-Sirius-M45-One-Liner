name: M45 ST29 Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'm45-st29/**'
      - '.github/workflows/m45-st29-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: m45-st29-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node m45-st29/test_sk.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: m45-st29/site
      - id: deployment
        uses: actions/deploy-pages@v4
