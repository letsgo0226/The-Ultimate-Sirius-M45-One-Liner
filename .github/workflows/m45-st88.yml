name: M45 ST88 Gödel Autonomous Engine CI
on:
  pull_request:
    paths:
      - 'm45_st88.py'
      - 'test_m45_st88.py'
      - '.github/workflows/m45-st88.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest -v test_m45_st88.py
      - name: Bounded execution smoke test
        run: python3 m45_st88.py --max-steps 3 --interval 0.01
      - name: Verify SHA-free implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('m45_st88.py').read_text()
          assert 'hashlib' not in source
          assert 'sha256' not in source.lower()
          PY
