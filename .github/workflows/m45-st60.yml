name: M45 ST60 Observer Agreement
on:
  push:
    paths:
      - 'm45-st60/**'
      - '.github/workflows/m45-st60.yml'
  pull_request:
    paths:
      - 'm45-st60/**'
      - '.github/workflows/m45-st60.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s m45-st60 -p 'test_*.py'
      - run: python3 m45-st60/observer_agreement.py --n 24 --m 3 --q 0.1
