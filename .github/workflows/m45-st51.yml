name: M45 ST51 Observational Invariants
on:
  push:
    paths:
      - 'm45-st49/**'
      - 'm45-st50/**'
      - 'm45-st51/**'
      - '.github/workflows/m45-st51.yml'
  pull_request:
    paths:
      - 'm45-st49/**'
      - 'm45-st50/**'
      - 'm45-st51/**'
      - '.github/workflows/m45-st51.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s m45-st49 -p 'test_*.py'
      - run: python3 -m unittest discover -s m45-st50 -p 'test_*.py'
      - run: python3 -m unittest discover -s m45-st51 -p 'test_*.py'
      - run: python3 m45-st51/invariants.py --n 32 --p 0.7 --gamma-a 0 --gamma-b 1
