name: M45 ST56 Environment-Induced Decoherence
on:
  push:
    paths:
      - 'm45-st56/**'
      - '.github/workflows/m45-st56.yml'
  pull_request:
    paths:
      - 'm45-st56/**'
      - '.github/workflows/m45-st56.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s m45-st56 -p 'test_*.py'
      - run: python3 m45-st56/environment.py --p 0.5 --theta 1.5707963267948966
