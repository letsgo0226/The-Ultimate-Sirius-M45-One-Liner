name: M45 ST37 Exact Verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'm45-st37/**'
      - '.github/workflows/m45-st37.yml'
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s m45-st37 -p 'test_*.py'
      - run: python3 m45-st37/exact.py --expression '@@@SKKS' --out exact-certificate.json
      - uses: actions/upload-artifact@v4
        with:
          name: m45-st37-exact-certificate
          path: exact-certificate.json
