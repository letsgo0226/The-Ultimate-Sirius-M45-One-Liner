name: M45 ST70 Relational Statistical Consensus
on:
  push:
    paths:
      - 'm45-st70/**'
      - 'm45-st69/observer_estimation.py'
      - 'm45-st68/quantum_metrology.py'
      - 'm45-st64/frame_switch.py'
      - '.github/workflows/m45-st70.yml'
  pull_request:
    paths:
      - 'm45-st70/**'
      - 'm45-st69/observer_estimation.py'
      - 'm45-st68/quantum_metrology.py'
      - 'm45-st64/frame_switch.py'
      - '.github/workflows/m45-st70.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s m45-st70 -p 'test_*.py'
      - run: python3 m45-st70/statistical_consensus.py --theta 0.3 --observers 5 --shots 1000 --flip 0.05 --alpha 0.05 --seed 2026
