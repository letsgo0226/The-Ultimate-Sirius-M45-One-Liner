name: M45 ST80 Discovery Benchmark
on:
  push:
    paths:
      - 'm45-st80/**'
      - 'm45-st79/model_evolution.py'
      - 'm45-st78/model_expansion.py'
      - 'm45-st76/bayesian_model_selection.py'
      - 'm45-st69/observer_estimation.py'
      - 'm45-st68/quantum_metrology.py'
      - 'm45-st64/frame_switch.py'
      - '.github/workflows/m45-st80.yml'
  pull_request:
    paths:
      - 'm45-st80/**'
      - 'm45-st79/model_evolution.py'
      - 'm45-st78/model_expansion.py'
      - 'm45-st76/bayesian_model_selection.py'
      - 'm45-st69/observer_estimation.py'
      - 'm45-st68/quantum_metrology.py'
      - 'm45-st64/frame_switch.py'
      - '.github/workflows/m45-st80.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s m45-st80 -p 'test_*.py'
      - run: python3 m45-st80/discovery_benchmark.py --replicates 12 --shots 20
