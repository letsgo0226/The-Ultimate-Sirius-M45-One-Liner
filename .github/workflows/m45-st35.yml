name: M45 ST35 Bounded Nested K
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'm45-st35/**'
      - '.github/workflows/m45-st35.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s m45-st35 -p 'test_*.py'
      - run: python3 m45-st35/tm.py --expression '@@K@SK@KS' --out certificate.json
      - uses: actions/upload-artifact@v4
        with:
          name: m45-st35-fixed-delta-certificate
          path: certificate.json
