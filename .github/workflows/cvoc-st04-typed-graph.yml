name: CVOC ST04 Typed Operator Graph
on:
  pull_request:
    paths:
      - 'cvoc-st04/**'
      - '.github/workflows/cvoc-st04-typed-graph.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s cvoc-st04 -p 'test_*.py' -v
