name: M45 ST50 Micro Macro Correspondence
on:
  push:
    paths:
      - 'm45-st49/**'
      - 'm45-st50/**'
      - '.github/workflows/m45-st50.yml'
  pull_request:
    paths:
      - 'm45-st49/**'
      - 'm45-st50/**'
      - '.github/workflows/m45-st50.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s m45-st49 -p 'test_*.py'
      - run: python3 -m unittest discover -s m45-st50 -p 'test_*.py'
      - run: python3 m45-st50/micro_macro.py --n 100 --p 0.7 --gamma 0
