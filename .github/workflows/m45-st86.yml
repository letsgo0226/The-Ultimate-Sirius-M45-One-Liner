name: M45 ST86 Constitutional Self-Assignment
on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]
  pull_request:
    paths:
      - 'm45-st86/**'
      - '.github/workflows/m45-st86.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  self-assignment:
    # Never check out or execute pull-request code in this privileged workflow.
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.user.login == github.repository_owner && !github.event.pull_request.draft && !github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assign owner-authored ready PR to repository owner
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const pr = context.payload.pull_request;
            if (!pr || pr.user.login !== owner || pr.draft || pr.merged) {
              core.info('Fail closed: no assignment');
              return;
            }
            await github.rest.issues.addAssignees({
              owner, repo: context.repo.repo,
              issue_number: pr.number, assignees: [owner]
            });
            core.info('Assigned task ownership only; no review approval or merge');
  policy-tests:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s m45-st86 -p 'test_*.py'
