name: M45 ST58 Spectrum Broadcast Structure
on:
  push:
    paths:
      - 'm45-st58/**'
      - '.github/workflows/m45-st58.yml'
  pull_request:
    paths:
      - 'm45-st58/**'
      - '.github/workflows/m45-st58.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s m45-st58 -p 'test_*.py'
      - run: python3 m45-st58/spectrum_broadcast.py --n 3 --p 0.5 --q 0.1
