name: M45 ST40 G2112 Prime Operators
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'm45-st40/**'
      - '.github/workflows/m45-st40.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s m45-st40 -p 'test_*.py'
      - run: python3 m45-st40/g2112.py --primes 5 --operator rotate --out g2112-certificate.json
      - uses: actions/upload-artifact@v4
        with:
          name: m45-st40-g2112-certificate
          path: g2112-certificate.json
